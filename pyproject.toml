[project]
name = "py_qwop"
version = "1.0.0"
description = "A python game adaptation of the game qwop."
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6.0",
    "pymunk>=6.5.0",
]

[project.scripts]
py_qwop = "py_qwop:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100